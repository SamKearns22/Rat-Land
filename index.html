<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Rat Land</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<canvas id="game"></canvas>

<div id="help">Rat Land</div>

<div id="reputation">Reputation: 0</div>
<button id="reset-save" type="button">Reset Save</button>

<div id="dialogue-box">
  <div id="dialogue-name"></div>
  <div id="dialogue-text"></div>
</div>

<div id="prebattle-menu" class="overlay-menu">
  <div id="prebattle-name" class="overlay-title"></div>
  <button id="prebattle-talk" class="overlay-btn" type="button">Talk</button>
  <button id="prebattle-fight" class="overlay-btn" type="button">Fight</button>
  <button id="prebattle-walk" class="overlay-btn" type="button">Walk Away</button>
</div>

<div id="battle-screen" class="overlay-menu battle-screen">
  <div id="battle-title" class="overlay-title"></div>

  <!-- Opponent panel: top, per classic Pokémon-style layout. -->
  <div class="combatant-panel combatant-enemy" id="battle-panel-enemy">
    <div class="combatant-name" id="battle-name-enemy"></div>
    <div class="bar-row">
      <span class="bar-label">HP</span>
      <div class="bar-track"><div class="bar-fill bar-fill-hp" id="battle-hp-fill-enemy"></div></div>
      <span class="bar-value" id="battle-hp-text-enemy"></span>
    </div>
    <div class="bar-row">
      <span class="bar-label">EF</span>
      <div class="bar-track"><div class="bar-fill bar-fill-effort" id="battle-effort-fill-enemy"></div></div>
      <span class="bar-value" id="battle-effort-text-enemy"></span>
    </div>
    <div id="battle-icons-enemy" class="status-icons"></div>
  </div>

  <!-- Player panel: bottom-opposite corner from the opponent. -->
  <div class="combatant-panel combatant-player" id="battle-panel-player">
    <div class="combatant-name">You</div>
    <div class="bar-row">
      <span class="bar-label">HP</span>
      <div class="bar-track"><div class="bar-fill bar-fill-hp" id="battle-hp-fill-player"></div></div>
      <span class="bar-value" id="battle-hp-text-player"></span>
    </div>
    <div class="bar-row">
      <span class="bar-label">EF</span>
      <div class="bar-track"><div class="bar-fill bar-fill-effort" id="battle-effort-fill-player"></div></div>
      <span class="bar-value" id="battle-effort-text-player"></span>
    </div>
    <div id="battle-icons-player" class="status-icons"></div>
  </div>

  <div id="battle-icon-explain"></div>
  <div id="battle-log"></div>
  <div id="battle-result"></div>

  <div id="battle-move-desc"></div>
  <div id="battle-moves" class="move-grid">
    <button id="battle-move-0" class="overlay-btn move-btn" type="button"></button>
    <button id="battle-move-1" class="overlay-btn move-btn" type="button"></button>
    <button id="battle-move-2" class="overlay-btn move-btn" type="button"></button>
    <button id="battle-move-3" class="overlay-btn move-btn" type="button"></button>
  </div>
  <button id="battle-confirm-move" class="overlay-btn" type="button">Use Move</button>
  <button id="battle-continue" class="overlay-btn" type="button">Continue</button>
</div>

<div id="controls">
  <button id="btn-up" class="pad-btn" aria-label="Move up">&#9650;</button>
  <button id="btn-left" class="pad-btn" aria-label="Move left">&#9664;</button>
  <button id="btn-right" class="pad-btn" aria-label="Move right">&#9654;</button>
  <button id="btn-down" class="pad-btn" aria-label="Move down">&#9660;</button>
  <button id="btn-interact" class="pad-btn" aria-label="Talk">TALK</button>
</div>

<script src="js/map.js"></script>
<script src="js/npc.js"></script>
<script src="js/player.js"></script>
<script src="js/rendering.js"></script>
<script src="js/transitions.js"></script>
<script src="js/input.js"></script>
<script src="js/save.js"></script>
<script src="js/combat.js"></script>
<script src="js/main.js"></script>
</body>
</html>
